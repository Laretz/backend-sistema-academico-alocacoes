name: 🧪 Run Unit Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  run-unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pgpassword
          POSTGRES_DB: postgresbd_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate
        working-directory: ./backend
        env:
          DATABASE_URL: "postgresql://postgres:pgpassword@postgres:5432/postgresbd_test"

      - name: Prepare database (migrate)
        run: npx prisma migrate deploy
        working-directory: ./backend
        env:
          DATABASE_URL: "postgresql://postgres:pgpassword@postgres:5432/postgresbd_test"

      - name: Run unit tests
        run: npm run test
        env:
          JWT_SECRET: testing
          DATABASE_URL: "postgresql://postgres:pgpassword@postgres:5432/postgresbd_test"
