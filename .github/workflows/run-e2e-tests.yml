name: Run E2E Tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  run-e2e-tests:
    name: Run E2E Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        ports:
          - "5432:5432"
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pgpassword
          POSTGRES_DB: postgresbd_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./backend

      - name: Prepare database (migrate)
        run: npx prisma migrate deploy
        working-directory: ./backend
        env:
          DATABASE_URL: "postgresql://postgres:pgpassword@localhost:5432/postgresbd_test"

      - name: Run e2e tests
        run: npm run test:e2e
        working-directory: ./backend
        env:
          JWT_SECRET: testing
          DATABASE_URL: "postgresql://postgres:pgpassword@localhost:5432/postgresbd_test"
